<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - Om Panchal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #007BFF;
      color: white;
      text-align: center;
      padding: 15px;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    .card h3 {
      margin-bottom: 10px;
      color: #007BFF;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: #007BFF;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.3s;
    }
    .card a:hover {
      background: #0056b3;
    }
    footer {
      text-align: center;
      background: #007BFF;
      color: white;
      padding: 12px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>All Useful Tools</h1>
    <p>Click any tool to open</p>
  </header>

  <div class="container">
    <div class="card">
      <h3>⌨ Typing Practice</h3>
      <p>Improve your typing speed & accuracy.</p>
      <a href="typing.html">Open</a>
    </div>
    <div class="card">
      <h3>🧮 Calculator</h3>
      <p>Perform quick calculations.</p>
      <a href="calculator.html">Open</a>
    </div>
   <div class="card">
  <h3>🔄 Conversion Tool</h3>
  <p>Convert units quickly and easily.</p>
  <a href="convertion.html">Open</a>
</div>
  </div>

  <footer>
    <p>© 2025 Om Panchal | All Rights Reserved</p>
  </footer>

</body>
</html>
